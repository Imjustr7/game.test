  function setLessonWrong(message) {
    lesson.questionState.wrong=true;
    lesson.questionState.error=message||"Belum tepat. Coba lagi.";
    lesson.attempts++;
    playTone("wrong");
    renderApp();
  }
  function checkAnswer() {
    const q=lesson.questions[lesson.index];
    const qs=lesson.questionState;
    if (!lessonCanCheck()) return;
    let correct=false;
    if (lesson.course.interaction==="trace") correct=qs.drawn;
    else if (lesson.course.interaction==="text") correct=qs.textAnswer.trim().toLowerCase()===String(q.answer).trim().toLowerCase();
    else if (lesson.course.interaction==="construct") correct=qs.wordBuild.map(id=>qs.tiles.find(tile=>tile.id===id)?.char||"").join("")===q.material.word;
    else correct=String(qs.selected).trim().toLowerCase()===String(q.answer).trim().toLowerCase();
    if (!correct) return setLessonWrong(`Belum tepat. ${q.feedback}`);
    qs.checked=true;
    qs.feedback=lesson.course.interaction==="trace"?`Bentuk ${q.material.glyph} berhasil kamu telusuri. Ini latihan panduan, bukan pengenal tulisan otomatis.`:q.feedback;
    lesson.correctCount+=1;
    playTone("correct");
    renderApp();
    requestAnimationFrame(()=>document.querySelector('[data-action="next-question"]')?.focus());
  }
  function nextQuestion() {
    if (lesson.questionState.wrong) return resetCurrentQuestion();
    if (!lesson.questionState.checked) return;
    if (lesson.index+1>=lesson.questions.length) return finishLesson();
    lesson.index++;
    initializeQuestionState();
    renderApp();
    requestAnimationFrame(()=>document.querySelector('[data-answer],#lesson-answer,#trace-canvas,.pair-tile,.memory-card')?.focus());
  }
  function finishLesson() {
    stopLessonTimer();
    const total=lesson.course.interaction==="pairs"||lesson.course.interaction==="memory"?lesson.course.materials.length:lesson.questions.length;
    const correct=lesson.course.interaction==="pairs"||lesson.course.interaction==="memory"?lesson.course.materials.length:lesson.correctCount;
    const score=Math.round(correct/Math.max(1,total)*100);
    const result=game.completeLesson(lesson.course.id,lesson.mode,score,correct);
    lesson.result=result;
    playTone("reward");
    renderApp();
    requestAnimationFrame(()=>document.querySelector('[data-action="result-path"]')?.focus());
  }
  function startReview(courseId) {
    const course=Store.COURSE_BY_ID.get(courseId);
    if (!course) return;
    beginLesson(courseId,"practice");
  }

  function handlePairTap(button) {
    const side=button.dataset.pairSide;
    const index=Number(button.dataset.pairIndex);
    const q=lesson.questionState;
    q.pairMessage="";
    if (side==="left") q.pairLeft=index;
    else q.pairRight=index;
    if (q.pairLeft!==null&&q.pairRight!==null) {
      if (q.pairLeft===q.pairRight) {
        q.pairMatches[q.pairLeft]=q.pairRight;
        q.pairMessage="Pasangan cocok.";
        if (Object.keys(q.pairMatches).length===lesson.course.materials.length) {
          q.checked=true;
          q.feedback="Semua pasangan cocok. Bagus membaca aksara dan bunyinya.";
          lesson.correctCount=lesson.course.materials.length;
          playTone("correct");
        }
      } else {
        q.pairMessage="Belum cocok. Coba pasangkan aksara ini dengan bunyi lain.";
        playTone("wrong");
      }
      q.pairLeft=null; q.pairRight=null;
    }
    const focusSide=side,focusIndex=index;
    renderApp();
    requestAnimationFrame(()=>document.querySelector(`[data-pair-side="${focusSide}"][data-pair-index="${focusIndex}"]`)?.focus());
  }
  function handleMemoryTap(button) {
    const index=Number(button.dataset.memoryIndex);
    const q=lesson.questionState;
    if (q.memoryOpen.includes(index)||q.memoryMatched.includes(q.memoryCards[index].pair)||q.memoryOpen.length===2) return;
    q.memoryOpen.push(index);
    if (q.memoryOpen.length===2) {
      const [first,second]=q.memoryOpen;
      if (q.memoryCards[first].pair===q.memoryCards[second].pair) {
        q.memoryMatched.push(q.memoryCards[first].pair);
        q.memoryOpen=[];
        if (q.memoryMatched.length===lesson.course.materials.length) {
          q.checked=true;
          q.feedback="Semua pasangan ditemukan. Bagus mengingat bunyinya.";
          lesson.correctCount=lesson.course.materials.length;
          playTone("correct");
        }
        renderApp();
      } else {
        playTone("wrong");
        renderApp();
        window.setTimeout(()=>{
          if (!lesson||!lesson.questionState.memoryOpen) return;
          lesson.questionState.memoryOpen=[];
          renderApp();
        },720);
      }
      return;
    }
    renderApp();
    requestAnimationFrame(()=>document.querySelector(`[data-memory-index="${index}"]`)?.focus());
  }
  function setCurrentView(next) {
    if (!navItems.some(item=>item.id===next)&&next!=="settings") return;
    view=next;
    dialog=null;
    renderApp();
    requestAnimationFrame(()=>document.querySelector("#game-main")?.focus());
  }
  function exportSave() {
    try {
      const blob=new Blob([game.exportJSON()],{type:"application/json"});
      const url=URL.createObjectURL(blob);
      const link=document.createElement("a");
      link.href=url; link.download=`NihonGo-Ruri-save-${Store.todayKey()}.json`;
      document.body.append(link); link.click(); link.remove();
      window.setTimeout(()=>URL.revokeObjectURL(url),1000);
      showToast("Berkas progres berhasil diunduh.","success");
    } catch (error) { showToast("Browser tidak dapat membuat berkas progres.","warning"); }
  }
  function promptImport() {
    const picker=document.querySelector("#save-file");
    if (picker) picker.click();
    else showToast("Buka Profil atau Pengaturan untuk memilih berkas progres.","warning");
  }
  function resetGame() {
    if (!window.confirm("Hapus seluruh progres lokal, XP, permata, aksesori, dan pengaturan? Tindakan ini tidak dapat dibatalkan.")) return;
    stopLessonTimer(); lesson=null; dialog=null; game.reset();
    onboardingStage=0; onboardingName=""; onboardingGoal=15; view="onboarding";
    renderApp();
  }
  function openCourseFromMap(courseId) {
    const course=Store.COURSE_BY_ID.get(courseId);
    if (!course) return;
    if (!game.isPracticeUnlocked(course)) return openDialog({type:"locked",courseId},"[data-dialog-initial]");
    openDialog({type:"course",courseId});
  }
  function handleAction(action,element) {
    if (action==="close-dialog") return closeDialog();
    if (action==="onboard-next") {
      const name=document.getElementById("player-name")?.value.trim()||onboardingName.trim();
      if (!name) { showToast("Isi nama panggilan untuk memulai.","warning"); document.getElementById("player-name")?.focus(); return; }
      onboardingName=name.slice(0,24); onboardingStage=1; renderApp(); return;
    }
    if (action==="onboard-back") { onboardingStage=0; renderApp(); requestAnimationFrame(()=>document.getElementById("player-name")?.focus()); return; }
    if (action==="onboard-start") {
      const name=document.getElementById("player-name")?.value.trim()||onboardingName.trim()||"Rina";
      onboardingName=name.slice(0,24); game.setProfile(onboardingName,onboardingGoal);
      view="home"; beginLesson(DATA.courses[0].id,"practice"); return;
    }
    if (action==="exit-lesson") {
      if (lesson&&(lesson.index>0||lesson.questionState.selected||lesson.questionState.drawn||lesson.questionState.wordBuild.length)&&!window.confirm("Keluar dari latihan? Jawaban yang belum selesai tidak disimpan.")) return;
      stopLessonTimer(); lesson=null; view="home"; renderApp(); return;
    }
    if (action==="check-answer") return checkAnswer();
    if (action==="next-question") return nextQuestion();
    if (action==="retry-question") return resetCurrentQuestion();
    if (action==="retry-speed") { lesson.timeRemaining=lesson.mode==="legendary"?60:45; lesson.questionState.timeExpired=false; renderApp(); return; }
    if (action==="clear-trace") { lesson.questionState.drawn=false; renderApp(); return; }
    if (action==="undo-tile") { const tileId=lesson.questionState.wordBuild.pop(); if(tileId)lesson.questionState.usedTiles=lesson.questionState.usedTiles.filter(id=>id!==tileId); renderApp(); return; }
    if (action==="speak") return speakJapanese(lesson.questions[lesson.index].material.word);
    if (action==="result-path") { lesson=null; view="home"; renderApp(); requestAnimationFrame(drawRoute); return; }
    if (action==="result-legendary") { const id=element.dataset.course; lesson=null; view="home"; beginLesson(id,"legendary"); return; }
    if (action==="rename") return openDialog({type:"rename"},"#rename-field");
    if (action==="export") return exportSave();
    if (action==="import-prompt") return promptImport();
    if (action==="reset") return resetGame();
  }

  root.addEventListener("click",event=>{
    const target=event.target.closest("button,[data-nav],[data-course-id],[data-overlay]");
    if (!target) return;
    if (target.dataset.nav) { setCurrentView(target.dataset.nav); return; }
    if (target.dataset.action) return handleAction(target.dataset.action,target);
    if (target.dataset.zoneLevel) {
      const chapter=state().selection.chapter;
      const start=Number(target.dataset.zoneLevel);
      const size=DATA.chapters[chapter].levels/10;
      const group=DATA.levelLookup[chapter].slice(start-1,start-1+size);
      const courses=group.flatMap(record=>record.courses);
      const next=courses.find(course=>!game.courseProgress(course.id).practiceComplete);
      const destination=next||courses[courses.length-1];
      game.setSelection(chapter,destination.level,destination.course);
      if (!game.isPracticeUnlocked(destination)) { openCourseFromMap(destination.id); return; }
      renderApp();
      requestAnimationFrame(()=>{drawRoute();document.querySelector(".course-shelf")?.scrollIntoView({behavior:"smooth",block:"start"});});
      return;
    }
    if (target.dataset.courseId) return openCourseFromMap(target.dataset.courseId);
    if (target.dataset.chapter) {
      const chapter=target.dataset.chapter;
      const course=game.currentCourse();
      const rememberedLevel=state().selection.levelsByChapter?.[chapter];
      const selectedLevel=rememberedLevel||(course.chapter===chapter?course.level:1);
      const selectedCourse=course.chapter===chapter&&course.level===selectedLevel?course.course:1;
      game.setSelection(chapter,selectedLevel,selectedCourse);
      view="home"; renderApp(); requestAnimationFrame(drawRoute); return;
    }
    if (target.dataset.levelStep) {
      const s=state().selection; game.setSelection(s.chapter,s.level+Number(target.dataset.levelStep)); renderApp(); requestAnimationFrame(drawRoute); return;
    }
    if (target.dataset.goal) {
      onboardingGoal=Number(target.dataset.goal); renderApp(); return;
    }
    if (target.dataset.library) { libraryChapter=target.dataset.library; view="characters"; renderApp(); return; }
    if (target.dataset.reviewId) { startReview(target.dataset.reviewId); return; }
    if (target.dataset.startMode) return beginLesson(target.dataset.course,target.dataset.startMode);
    if (target.dataset.answer!==undefined) {
      if (lesson?.questionState.checked||lesson?.questionState.wrong) return;
      lesson.questionState.selected=target.dataset.answer;
      speakIfJapanese(target.dataset.answer);
      document.querySelectorAll(".answer-option").forEach(button=>{button.classList.toggle("is-selected",button===target);button.setAttribute("aria-pressed",String(button===target));});
      syncCheckButton(); return;
    }
    if (target.dataset.pairSide) {
      if (target.dataset.pairSide==="left") speakIfJapanese(lesson?.course.materials[Number(target.dataset.pairIndex)]?.glyph);
      return handlePairTap(target);
    }
    if (target.dataset.memoryIndex!==undefined) return handleMemoryTap(target);
    if (target.dataset.wordTile) {
      const q=lesson.questionState;
      const id=target.dataset.wordTile;
      if (!q.usedTiles.includes(id)) { speakIfJapanese(q.tiles.find(item=>item.id===id)?.char); q.usedTiles.push(id); q.wordBuild.push(id); renderApp(); }
      return;
    }
    if (target.dataset.buy) {
      try { const item=game.purchase(target.dataset.buy); renderApp(); showToast(item.kind==="theme"?`${item.name} diterapkan.`:`${item.name} dipakai Ruri.`,"success"); playTone("reward"); }
      catch(error) { showToast(error.message,"warning"); }
      return;
    }
    if (target.dataset.equip) {
      const id=target.dataset.equip;
      game.selectCosmetic(id); renderApp(); showToast(id.startsWith("theme-")?"Tema permainan diperbarui.":"Aksesori Ruri diperbarui.","success"); return;
    }
    if (target.dataset.setting) {
      const key=target.dataset.setting;
      const enabled=!state().settings[key];
      game.setSetting(key,enabled);
      if (key==="sound"&&enabled) playTone("reward");
      renderApp();
      return;
    }
    if (target.dataset.overlay!==undefined&&event.target===target) closeDialog();
  });

  root.addEventListener("change",async event=>{
    const target=event.target;
    if (target.matches("[data-level-select]")) {
      const s=state().selection; game.setSelection(s.chapter,Number(target.value)); renderApp(); requestAnimationFrame(drawRoute); return;
    }
    if (target.matches("[data-setting-voice]")) { game.setSetting("voice",target.value); return; }
    if (target.matches("#save-file")&&target.files?.[0]) {
      const file=target.files[0];
      try {
        const text=await file.text();
        if (!window.confirm("Impor berkas ini dan timpa progres yang sedang tersimpan di browser ini?")) { target.value=""; return; }
        game.importJSON(text); stopLessonTimer(); lesson=null; dialog=null; view=state().profile.onboarded?"home":"onboarding"; onboardingStage=0; renderApp(); showToast("Progres berhasil diimpor.","success");
      } catch(error) { showToast(error.message||"Berkas progres tidak valid.","warning"); }
      target.value="";
    }
  });
  root.addEventListener("input",event=>{
    if (event.target.id==="player-name") onboardingName=event.target.value.slice(0,24);
    if (event.target.id==="lesson-answer"&&lesson) { lesson.questionState.textAnswer=event.target.value; syncCheckButton(); }
  });
  root.addEventListener("submit",event=>{
    const form=event.target.closest('[data-form="rename"]');
    if (!form) return;
    event.preventDefault();
    try { game.rename(new FormData(form).get("name")); dialog=null; renderApp(); showToast("Nama pemain diperbarui.","success"); }
    catch(error) { showToast(error.message,"warning"); }
  });
  document.addEventListener("keydown",event=>{
    if (event.key==="Escape"&&dialog) closeDialog();
    else if (event.key==="Escape"&&lesson&&!lesson.result) handleAction("exit-lesson",document.activeElement);
    else if (event.key==="Enter"&&event.target.id==="lesson-answer") { event.preventDefault(); if(lessonCanCheck())checkAnswer(); }
  });
  window.addEventListener("resize",()=>requestAnimationFrame(drawRoute));
  if ("speechSynthesis" in window) window.speechSynthesis.addEventListener?.("voiceschanged",()=>{if(view==="settings")renderApp();});

  renderApp();
})();

  </script>
</body>
</html>
