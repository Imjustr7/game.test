  <style>
:root {
  color-scheme: light;
  --ink: #24324a;
  --muted: #71809a;
  --blue: #2f7df0;
  --blue-dark: #1d5fd0;
  --sky: #79c9f3;
  --paper: #fffdf8;
  --white: #ffffff;
  --wash: #f2f8ff;
  --line: rgba(35, 87, 156, .13);
  --soft-line: rgba(35, 87, 156, .09);
  --coral: #d93a24;
  --gold: #ff9f1c;
  --green: #48a978;
  --chapter: #ee8198;
  --chapter-deep: #c84e69;
  --chapter-ground: #fff1f2;
  --chapter-accent: #dff2d0;
  --font: "Trebuchet MS", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --r-sm: 12px;
  --r-md: 18px;
  --r-lg: 27px;
  --ease: cubic-bezier(.22,.82,.22,1);
  --shadow-soft: 0 14px 40px rgba(37, 75, 125, .08);
}

* { box-sizing: border-box; }
html { min-width: 320px; scroll-behavior: smooth; }
body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background: #f8fbff;
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; }
button { color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, canvas:focus-visible {
  outline: 3px solid #f29c51;
  outline-offset: 3px;
}
button:disabled { cursor: not-allowed; }
a { color: inherit; }
::selection { color: #12386d; background: #c9e8ff; }

.skip-link {
  position: fixed;
  z-index: 20;
  top: 10px;
  left: 12px;
  padding: 10px 16px;
  transform: translateY(-160%);
  border-radius: 999px;
  background: var(--ink);
  color: white;
  text-decoration: none;
  transition: transform .35s var(--ease);
}
.skip-link:focus { transform: translateY(0); }
.visually-hidden { position: absolute !important; width: 1px !important; height: 1px !important; overflow: hidden !important; clip: rect(0,0,0,0) !important; white-space: nowrap !important; }
.boot-state, .noscript-note { padding: 32px; text-align: center; color: var(--muted); }
.app-shell { min-height: 100vh; display: grid; grid-template-columns: 228px minmax(0, 1fr); }
#app[data-cosmetic-theme="theme-sakura"] .app-shell { background: #fff6fa; }
#app[data-cosmetic-theme="theme-sakura"] .sidebar,
#app[data-cosmetic-theme="theme-sakura"] .topbar { background: #fff3f8; }
#app[data-cosmetic-theme="theme-sakura"] .sidebar-note { background: #ffeaf1; }
#app[data-cosmetic-theme="theme-night"] .app-shell { background: #e8eefb; }
#app[data-cosmetic-theme="theme-night"] .sidebar { background: #172943; border-right-color: #263c5d; }
#app[data-cosmetic-theme="theme-night"] .nav-label { color: #a8bad8; }
#app[data-cosmetic-theme="theme-night"] .nav-item { color: #d3def2; }
#app[data-cosmetic-theme="theme-night"] .nav-item:hover { background: #253b5c; color: #a9ceff; }
#app[data-cosmetic-theme="theme-night"] .nav-item.is-active { background: #2c456b; color: #b5d5ff; }
#app[data-cosmetic-theme="theme-night"] .sidebar-note { background: #223956; color: #c1cde1; }
#app[data-cosmetic-theme="theme-night"] .sidebar-note strong { color: #f2f6ff; }
#app[data-cosmetic-theme="theme-night"] .topbar { background: #e9effb; }

/* Navigation */
.sidebar {
  position: sticky;
  top: 0;
  display: flex;
  height: 100vh;
  min-height: 680px;
  flex-direction: column;
  padding: 27px 16px 18px;
  background: var(--paper);
  border-right: 1px solid var(--soft-line);
}
.brand-link { display: flex; width: max-content; align-items: center; gap: 9px; margin: 0 7px 34px; }
.brand-link .brand-icon { display: block; width: 48px; height: 48px; flex: 0 0 auto; }
.brand-link .brand-wordmark { display: block; width: 106px; height: auto; }
.nav-label { margin: 0 12px 11px; color: #8a98ac; font-size: 11px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; }
.main-nav { display: grid; gap: 6px; }
.nav-item {
  display: flex;
  min-height: 46px;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  border: 0;
  border-radius: 14px;
  background: transparent;
  color: #52627d;
  cursor: pointer;
  text-align: left;
  transition: background .32s var(--ease), color .32s var(--ease), transform .32s var(--ease);
}
.nav-item:hover { transform: translateX(2px); background: #edf5ff; color: var(--blue); }
.nav-item.is-active { background: #e9f3ff; color: var(--blue); font-weight: 800; }
.nav-item svg { width: 21px; height: 21px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav-item .nav-emoji { width: 22px; font-size: 18px; text-align: center; }
.sidebar-bottom { display: grid; gap: 10px; margin-top: auto; }
.sidebar-note { padding: 14px; border-radius: 17px; background: #eff7ff; color: #526884; font-size: 12px; }
.sidebar-note strong { display: block; margin-bottom: 3px; color: var(--ink); font-size: 13px; }
.sidebar-note p { margin: 0; }
.sidebar-settings { justify-content: flex-start; width: 100%; }

.workspace { min-width: 0; }
.topbar {
  display: flex;
  min-height: 78px;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 14px clamp(20px, 3vw, 42px);
  background: rgba(255,253,248,.85);
  border-bottom: 1px solid var(--soft-line);
}
.topbar-context { min-width: 0; }
.topbar-context p { margin: 0; color: var(--muted); font-size: 12px; }
.topbar-context strong { display: block; overflow: hidden; color: var(--ink); font-size: 16px; text-overflow: ellipsis; white-space: nowrap; }
.topbar-stats { display: flex; align-items: center; gap: 8px; }
.stat-pill {
  display: inline-flex;
  min-height: 40px;
  align-items: center;
  gap: 7px;
  padding: 7px 11px;
  border: 1px solid rgba(49,92,152,.11);
  border-radius: 999px;
  background: white;
  color: #455672;
  font-size: 13px;
  font-weight: 800;
  white-space: nowrap;
}
.stat-pill .stat-icon { font-size: 16px; }
.stat-pill.xp { color: #b27300; background: #fff8e8; border-color: rgba(255,189,53,.25); }
.stat-pill.gems { color: #2468bb; background: #eef8ff; }
.stat-pill.streak { color: #c24f3a; background: #fff2ee; }
.stat-pill.hearts { color: #ce4865; background: #fff2f5; }
.save-warning { display: none; padding: 9px 14px; background: #fff1da; color: #75511b; font-size: 13px; }
.save-warning.show { display: block; }

/* Main learning dashboard */
.dashboard-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 296px;
  align-items: start;
  gap: 27px;
  padding: 27px clamp(20px, 3vw, 42px) 64px;
}
.main-column { min-width: 0; }
.chapter-switcher { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin-bottom: 19px; }
.chapter-tab {
  position: relative;
  display: flex;
  min-height: 63px;
  align-items: center;
  gap: 10px;
  padding: 10px 13px;
  overflow: hidden;
  border: 1px solid var(--soft-line);
  border-radius: 17px;
  background: #fff;
  color: var(--muted);
  cursor: pointer;
  text-align: left;
  transition: transform .34s var(--ease), background .34s var(--ease), border-color .34s var(--ease), color .34s var(--ease);
}
.chapter-tab:hover:not(:disabled) { transform: translateY(-2px); border-color: rgba(23,96,212,.24); }
.chapter-tab.is-selected { border-color: color-mix(in srgb, var(--chapter) 45%, white); background: var(--chapter-ground); color: var(--ink); }
.chapter-tab:disabled { opacity: .58; cursor: default; }
.chapter-tab .chapter-symbol { display: grid; width: 34px; height: 34px; flex: 0 0 auto; place-items: center; border-radius: 12px; background: color-mix(in srgb, var(--chapter) 14%, white); font-size: 19px; }
.chapter-tab strong { display: block; overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.chapter-tab small { display: block; color: var(--muted); font-size: 10px; }

.chapter-heading { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 5px 0 17px; }
.chapter-copy h1 { margin: 0; color: var(--ink); font-size: clamp(23px, 2.1vw, 31px); letter-spacing: -.045em; line-height: 1.15; }
.chapter-copy p { max-width: 590px; margin: 8px 0 0; color: #66758c; font-size: 14px; }
.level-controls { display: flex; flex: 0 0 auto; align-items: center; gap: 7px; }
.level-control {
  display: grid;
  width: 36px;
  height: 36px;
  place-items: center;
  border: 1px solid rgba(41,85,144,.17);
  border-radius: 12px;
  background: #fff;
  color: #435873;
  cursor: pointer;
  transition: background .28s var(--ease), transform .28s var(--ease);
}
.level-control:hover:not(:disabled) { transform: translateY(-1px); background: #eef6ff; }
.level-control:disabled { opacity: .42; }
.level-select {
  min-height: 37px;
  max-width: 205px;
  padding: 6px 28px 6px 11px;
  border: 1px solid rgba(41,85,144,.17);
  border-radius: 12px;
  background: white;
  color: var(--ink);
  font-size: 12px;
  font-weight: 800;
}

.chapter-progress { display: flex; align-items: center; gap: 12px; margin: 0 0 15px; }
.progress-track { height: 9px; flex: 1; overflow: hidden; border-radius: 99px; background: rgba(41,85,144,.1); }
.progress-fill { width: var(--progress, 0%); height: 100%; border-radius: inherit; background: var(--chapter); transition: width .9s var(--ease); }
.progress-copy { color: #66758c; font-size: 11px; font-weight: 800; white-space: nowrap; }

.map-frame {
  position: relative;
  isolation: isolate;
  min-height: 580px;
  overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--chapter) 20%, white);
  border-radius: 25px;
  background: var(--chapter-ground);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
}
.map-landscape { position: absolute; z-index: -1; inset: 0; overflow: hidden; background: linear-gradient(180deg, color-mix(in srgb, var(--chapter-accent) 35%, white) 0%, var(--chapter-ground) 34%, #fffdf8 100%); }
.map-landscape::before, .map-landscape::after { position: absolute; z-index: 1; right: -8%; bottom: -38px; left: -8%; height: 185px; border-radius: 50% 50% 0 0 / 40% 40% 0 0; content: ""; }
.map-landscape::before { transform: rotate(-3deg); background: color-mix(in srgb, var(--chapter-accent) 42%, transparent); }
.map-landscape::after { right: 20%; bottom: -88px; left: -20%; transform: rotate(4deg); background: color-mix(in srgb, var(--chapter-accent) 28%, transparent); }
.map-landscape.theme-hiragana { background: linear-gradient(180deg,#c6eaff 0%,#e6f7fb 31%,#fff6f4 66%,#e9f4d7 100%); }
.map-landscape.theme-katakana { background: linear-gradient(180deg,#55508c 0%,#9d79bd 40%,#f3b6be 76%,#d9d0f2 100%); }
.map-landscape.theme-katakana::before, .map-landscape.theme-katakana::after { display: none; }
.map-landscape.theme-kanji { background: linear-gradient(180deg,#b9d8ed 0%,#f0ddbd 47%,#fff1d7 80%,#d9d4ad 100%); }
.map-landscape.theme-kanji::before { background: rgba(227,209,163,.38); }
.map-landscape.theme-kanji::after { background: rgba(198,181,128,.28); }
.map-scene-art { position: absolute; z-index: 0; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; opacity: .55; }
.map-sun { position: absolute; z-index: 2; top: 37px; right: 42px; width: 62px; height: 62px; border: 1px solid rgba(255,255,255,.7); border-radius: 50%; background: radial-gradient(circle at 35% 30%,#fff5bf,#ffd875 66%,#ffc65b); box-shadow: 0 0 0 9px rgba(255,220,135,.12),0 0 32px rgba(255,213,128,.3); animation: sun-breathe 6s ease-in-out infinite; }
.theme-katakana .map-sun { background: radial-gradient(circle at 35% 30%,#ffb6d9,#ed65a5 70%,#b94d91); box-shadow: 0 0 0 10px rgba(249,153,211,.15),0 0 34px rgba(248,124,203,.44); }
.theme-kanji .map-sun { background: radial-gradient(circle at 35% 30%,#fff5d1,#f3c475 70%,#db985a); }

/* Utility rail */

.guide-panel, .quest-panel, .progress-panel {

  background: white;
  box-shadow: 0 9px 28px rgba(37,75,125,.045);
}
.guide-panel { position: relative; display: flex; min-height: 182px; align-items: center; gap: 10px; overflow: hidden; padding: 17px 14px 17px 15px; background: #edf7ff; }

.guide-art { position: relative; z-index: 1; width: 108px; flex: 0 0 108px; align-self: end; }

/* Buttons and overlays */

  display: inline-flex;
  min-height: 45px;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 10px 18px;
  border: 0;
  border-radius: 999px;
  background: var(--blue);
  color: #fff;
  cursor: pointer;
  font-weight: 800;
  text-decoration: none;
  transition: transform .32s var(--ease), background .32s var(--ease), box-shadow .32s var(--ease), opacity .32s var(--ease);
}
.button:hover:not(:disabled) { transform: translateY(-2px); background: var(--blue-dark); box-shadow: 0 6px 16px rgba(23,96,212,.18); }
.button:active:not(:disabled) { transform: scale(.98); }
.button:disabled { opacity: .48; }
.button .button-icon { display: grid; width: 26px; height: 26px; place-items: center; border-radius: 50%; background: rgba(255,255,255,.18); transition: transform .32s var(--ease); }
.button:hover:not(:disabled) .button-icon { transform: translateX(2px); }
.button.secondary { border: 1px solid rgba(41,85,144,.18); background: white; color: #52627c; box-shadow: none; }
.button.secondary:hover:not(:disabled) { background: #f0f6ff; color: var(--blue); }
.button.warm { background: var(--coral); }
.button.warm:hover:not(:disabled) { background: #d95232; }
.button.gold { background: #f2b72e; color: #664500; }
.button.gold:hover:not(:disabled) { background: #e8a91a; }
.button.full { width: 100%; }
.button.small { min-height: 37px; padding: 8px 14px; font-size: 12px; }
.text-button { min-height: 42px; padding: 8px 12px; border: 0; border-radius: 12px; background: transparent; color: #61718a; cursor: pointer; font-weight: 800; }
.text-button:hover { background: #edf5ff; color: var(--blue); }
.overlay { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(31,50,77,.4); animation: veil-in .28s var(--ease) both; }
.dialog-shell { width: min(510px, 100%); padding: 6px; border: 1px solid rgba(40,98,168,.16); border-radius: 29px; background: rgba(255,255,255,.76); box-shadow: 0 22px 70px rgba(28,52,84,.18); animation: dialog-in .48s var(--ease) both; }
.dialog-core { position: relative; padding: 25px; border: 1px solid rgba(255,255,255,.95); border-radius: 23px; background: var(--paper); }
.dialog-close { position: absolute; top: 14px; right: 14px; display: grid; width: 36px; height: 36px; place-items: center; border: 0; border-radius: 50%; background: #eff4f9; color: #5e6d81; cursor: pointer; font-size: 20px; }
.dialog-close:hover { background: #e5eef9; }
.dialog-ruri { display: flex; align-items: center; gap: 12px; margin: 0 42px 15px 0; }
.dialog-ruri .ruri-portrait { width: 67px; flex: 0 0 67px; }
.dialog-ruri h2 { margin: 0; font-size: 22px; letter-spacing: -.04em; line-height: 1.16; }
.dialog-ruri p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
.dialog-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 21px; }
.dialog-actions .button { flex: 1 1 auto; }
.course-facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 13px 0; }
.fact-chip { padding: 7px 10px; border-radius: 999px; background: #f0f6ff; color: #59708c; font-size: 11px; font-weight: 800; }
.legendary-unavailable { margin: 9px 0 0; color: #8792a3; font-size: 11px; }
.modal-body-copy { color: #5f6f87; font-size: 14px; }
.modal-body-copy p { margin: 8px 0; }
.modal-body-copy ul { padding-left: 19px; }
.modal-body-copy li { margin: 4px 0; }
.field-label { display: block; margin: 15px 0 6px; color: #53637b; font-size: 12px; font-weight: 800; }
.text-field, .select-field { width: 100%; min-height: 45px; padding: 10px 13px; border: 1px solid rgba(41,85,144,.2); border-radius: 13px; background: #fff; color: var(--ink); }
.field-help { margin: 5px 0 0; color: #7c8aa0; font-size: 11px; }

/* First meeting */
.onboarding {
  display: grid;
  min-height: 100vh;
  place-items: center;
  padding: 28px;
  background: #eaf5ff;
  background-image: radial-gradient(circle at 11% 19%, rgba(255,255,255,.8) 0 60px, transparent 61px), radial-gradient(circle at 90% 81%, rgba(188,229,176,.76) 0 180px, transparent 181px), linear-gradient(150deg, #eaf5ff 0%, #fff8ed 100%);
}
.onboard-frame { display: grid; width: min(960px, 100%); min-height: 540px; grid-template-columns: .82fr 1.18fr; overflow: hidden; border: 1px solid rgba(35,87,156,.1); border-radius: 31px; background: rgba(255,255,255,.9); box-shadow: 0 20px 70px rgba(42,81,127,.13); }
.onboard-art { position: relative; display: grid; min-height: 540px; place-items: center; overflow: hidden; background: linear-gradient(165deg, #d9edff, #ecf8e6); }
.onboard-art::before { position: absolute; right: -43px; bottom: -62px; left: -39px; height: 195px; border-radius: 50% 50% 0 0 / 38% 38% 0 0; background: rgba(128,203,119,.29); content: ""; }
.onboard-art::after { position: absolute; top: 52px; left: 49px; width: 85px; height: 85px; border-radius: 50%; background: rgba(255,255,255,.65); content: ""; }
.onboard-art .onboard-ruri { position: relative; z-index: 1; display: block; width: min(76%, 310px); height: auto; animation: float-ruri 4.3s var(--ease) infinite; }
.onboard-art .brand-stamp { position: absolute; z-index: 2; bottom: 28px; left: 28px; display: flex; width: 138px; align-items: center; gap: 5px; padding: 4px 6px; border-radius: 14px; background: rgba(255,255,255,.86); box-shadow: 0 5px 18px rgba(36,50,74,.1); }
.onboard-art .brand-stamp .brand-icon { display: block; width: 30px; height: 30px; flex: 0 0 auto; }
.onboard-art .brand-stamp .brand-wordmark { display: block; width: 86px; height: auto; }
.onboard-copy { display: flex; flex-direction: column; justify-content: center; padding: clamp(28px, 5vw, 56px); }
.onboard-copy h1 { max-width: 490px; margin: 0; color: var(--ink); font-size: clamp(32px, 4vw, 47px); letter-spacing: -.06em; line-height: 1.05; }
.onboard-copy .lead { max-width: 480px; margin: 13px 0 23px; color: #64758c; font-size: 16px; }
.onboard-dialogue { display: flex; align-items: flex-start; gap: 11px; margin-bottom: 19px; padding: 14px 16px; border-radius: 16px; background: #f0f7ff; color: #526782; }
.onboard-dialogue span { font-size: 20px; }
.onboard-dialogue p { margin: 0; font-size: 13px; }
.onboard-field-row { display: grid; grid-template-columns: 1fr; gap: 0; max-width: 420px; }
.time-options { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
.time-option { min-width: 73px; min-height: 38px; padding: 8px 12px; border: 1px solid rgba(41,85,144,.18); border-radius: 999px; background: white; color: #5a6a83; cursor: pointer; font-size: 12px; font-weight: 800; }
.time-option.is-selected { border-color: var(--blue); background: #edf5ff; color: var(--blue); }
.onboard-footer { display: flex; align-items: center; gap: 11px; margin-top: 23px; }
.onboard-footer .button { min-width: 192px; }
.step-dots { display: flex; gap: 5px; }
.step-dots i { width: 7px; height: 7px; border-radius: 50%; background: #d7e1eb; }
.step-dots i.active { width: 20px; border-radius: 99px; background: var(--blue); }
.classroom { display: grid; grid-template-columns: 1fr 190px; align-items: center; gap: 20px; margin: 17px 0; }
.classroom-board { display: grid; min-height: 150px; place-items: center; border-radius: 19px; background: #316a68; box-shadow: inset 0 0 0 6px #e8c795, inset 0 0 0 10px #b68858; color: white; text-align: center; }
.classroom-board span { display: block; font-size: 30px; font-weight: 800; letter-spacing: .12em; }
.classroom-board small { display: block; color: #d8efe9; }
.sensei-card { color: #5d6d83; font-size: 12px; }
.sensei-card strong { display: block; margin-bottom: 5px; color: var(--ink); font-size: 14px; }

/* Lesson screen */
.lesson-screen { display: flex; min-height: 100vh; flex-direction: column; background: #fffdf8; }
.lesson-top { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; align-items: center; gap: 16px; padding: 20px clamp(18px, 6vw, 84px); }
.lesson-exit { display: grid; width: 40px; height: 40px; place-items: center; border: 0; border-radius: 50%; background: #f0f4f8; color: #69788e; cursor: pointer; font-size: 19px; }

.lesson-progress-track { height: 12px; overflow: hidden; border-radius: 99px; background: #e8edf3; }
.lesson-progress-track span { display: block; width: var(--lesson-progress,0%); height: 100%; border-radius: inherit; background: #67b7e6; transition: width .6s var(--ease); }
.lesson-hearts { color: #d55068; font-weight: 800; white-space: nowrap; }
.lesson-content { display: grid; width: min(680px, calc(100% - 36px)); flex: 1; align-content: center; justify-items: stretch; gap: 17px; margin: 0 auto; padding: 18px 0 45px; }
.lesson-kicker { margin: 0; color: #8794a6; font-size: 12px; font-weight: 800; }
.lesson-content h1 { margin: 0; font-size: clamp(25px, 4vw, 34px); letter-spacing: -.045em; line-height: 1.18; }
.lesson-prompt { max-width: 620px; margin: 0; color: #455672; font-size: 17px; }
.lesson-example { display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 11px 16px; border-radius: 16px; background: #f2f7fc; color: #52637c; }
.lesson-example .jp-large { color: var(--ink); font-size: 29px; font-weight: 800; line-height: 1; }
.lesson-example small { display: block; color: #8190a4; font-size: 11px; }
.answer-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 4px; }
.answer-option { min-height: 65px; padding: 12px 15px; border: 2px solid #dfe7ef; border-radius: 15px; background: white; color: #40516c; cursor: pointer; font-size: 18px; font-weight: 800; text-align: center; transition: transform .28s var(--ease), border-color .28s var(--ease), background .28s var(--ease); }
.answer-option:hover { transform: translateY(-1px); border-color: #8ebde6; background: #f5faff; }
.answer-option.is-selected { border-color: var(--blue); background: #edf5ff; color: var(--blue); }
.answer-option.is-correct { border-color: #55a977; background: #edf8f1; color: #317c52; }
.answer-option.is-wrong { border-color: #dd6d77; background: #fff1f2; color: #b84557; }
.answer-note { min-height: 25px; color: #728098; font-size: 12px; }
.answer-note.good { color: #398254; }
.answer-note.bad { color: #b64554; }
.lesson-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px clamp(18px, 6vw, 84px) 22px; border-top: 1px solid rgba(35,87,156,.11); }
.lesson-bottom .button { min-width: 160px; }
.lesson-bottom .text-button { min-width: 120px; }
.audio-prompt { display: inline-flex; align-items: center; gap: 10px; }
.audio-button { display: grid; width: 48px; height: 48px; flex: 0 0 auto; place-items: center; border: 0; border-radius: 50%; background: #e9f5ff; color: var(--blue); cursor: pointer; font-size: 21px; }
.audio-button:hover { background: #d8ecff; }
.trace-wrap { display: grid; grid-template-columns: minmax(0,1fr) 130px; align-items: center; gap: 17px; }
.trace-canvas-shell { position: relative; overflow: hidden; border: 2px solid #d8e4ef; border-radius: 18px; background-color: white; background-image: linear-gradient(rgba(41,85,144,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(41,85,144,.06) 1px,transparent 1px); background-size: 26px 26px; touch-action: none; }
.trace-canvas-shell canvas { display: block; width: 100%; height: 225px; touch-action: none; cursor: crosshair; }
.trace-guide { position: absolute; inset: 0; display: grid; place-items: center; color: #dae5f0; font-size: 155px; font-weight: 800; line-height: 1; pointer-events: none; user-select: none; }
.trace-aside { color: #75839a; font-size: 11px; }
.trace-aside strong { display: block; margin-bottom: 6px; color: var(--ink); font-size: 14px; }
.trace-clear { margin-top: 8px; padding: 0; border: 0; background: none; color: var(--blue); cursor: pointer; font-size: 11px; font-weight: 800; }
.pair-board { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pair-column { display: grid; gap: 8px; }
.pair-tile { min-height: 48px; padding: 9px 12px; border: 1px solid #dfe7ef; border-radius: 13px; background: white; color: #4d5f79; cursor: pointer; font-weight: 800; text-align: center; }
.pair-tile.is-selected { border-color: var(--blue); background: #edf5ff; color: var(--blue); }
.pair-tile.is-paired { border-color: #8dccaa; background: #eff8f2; color: #397d55; }
.word-tiles { display: flex; min-height: 55px; flex-wrap: wrap; align-items: center; gap: 7px; padding: 8px; border-bottom: 2px solid #9aa9ba; }
.word-tiles button { min-width: 38px; min-height: 42px; border: 1px solid #dce5ee; border-radius: 11px; background: white; color: #374b66; cursor: pointer; font-size: 20px; font-weight: 800; }
.word-tiles button.is-used { opacity: .3; }
.word-answer { min-height: 54px; margin: 5px 0; padding: 10px; border: 2px dashed #c8d7e5; border-radius: 14px; color: var(--blue); font-size: 21px; font-weight: 800; }
.memory-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
.memory-card { min-height: 63px; border: 1px solid #dce6f0; border-radius: 14px; background: #eef5fc; color: var(--blue); cursor: pointer; font-size: 21px; font-weight: 800; }
.memory-card.is-open { background: white; color: var(--ink); }
.memory-card.is-matched { border-color: #8dccaa; background: #edf8f1; color: #397d55; }
.timer-chip { justify-self: end; padding: 6px 11px; border-radius: 999px; background: #fff3e3; color: #9d6511; font-size: 12px; font-weight: 800; }
.result-screen { display: grid; min-height: 100vh; place-items: center; padding: 24px; background: #eaf5ff; }
.result-card { width: min(540px,100%); padding: 34px; border-radius: 29px; background: white; box-shadow: var(--shadow-soft); text-align: center; }
.result-ruri { width: 132px; margin: 0 auto 5px; animation: reward-hop .72s var(--ease) both; }
.result-ruri .ruri-portrait { display: block; width: 100%; }
.result-card h1 { margin: 7px 0; font-size: clamp(27px,5vw,39px); letter-spacing: -.05em; }
.result-card p { margin: 8px auto; color: #67778e; }
.reward-line { display: inline-flex; align-items: center; gap: 8px; margin: 11px 0 4px; padding: 10px 16px; border-radius: 999px; background: #fff5d9; color: #926315; font-size: 17px; font-weight: 900; }
.result-actions { display: flex; justify-content: center; gap: 9px; margin-top: 20px; }
.result-unlock { color: #368658 !important; font-weight: 800; }

/* Supporting screens */
.section-view { width: min(1050px,100%); margin: 0 auto; padding: 28px 0 52px; }
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 0 0 21px; }
.section-head h1 { margin: 0; font-size: clamp(26px,3vw,36px); letter-spacing: -.055em; line-height: 1.1; }
.section-head p { margin: 7px 0 0; color: var(--muted); }
.surface { border: 1px solid rgba(35,87,156,.12); border-radius: 23px; background: white; box-shadow: 0 9px 28px rgba(37,75,125,.045); }
.library-tabs { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 15px; }
.library-tab { min-height: 39px; padding: 8px 13px; border: 1px solid rgba(41,85,144,.16); border-radius: 999px; background: white; color: #60708a; cursor: pointer; font-size: 12px; font-weight: 800; }
.library-tab.is-active { border-color: var(--blue); background: #edf5ff; color: var(--blue); }
.character-grid { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 9px; padding: 18px; }
.character-tile { display: grid; min-height: 142px; align-content: center; justify-items: center; gap: 3px; padding: 11px; border-radius: 16px; background: #f3f8fd; text-align: center; }
.character-tile .character-glyph { color: var(--blue); font-size: 35px; font-weight: 800; line-height: 1.1; }
.character-tile strong { font-size: 12px; }
.character-tile small { color: #7d8ba0; font-size: 10px; }
.practice-options { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 13px; }
.practice-card { display: flex; min-height: 145px; align-items: center; gap: 14px; padding: 19px; border: 1px solid rgba(35,87,156,.12); border-radius: 20px; background: white; cursor: pointer; text-align: left; transition: transform .34s var(--ease), box-shadow .34s var(--ease); }
.practice-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }
.practice-card .practice-symbol { display: grid; width: 52px; height: 52px; flex: 0 0 auto; place-items: center; border-radius: 16px; background: #eaf4ff; font-size: 25px; }
.practice-card strong { display: block; margin-bottom: 4px; font-size: 15px; }
.practice-card span:last-child { color: #71809a; font-size: 12px; }
.ranking-list { display: grid; gap: 7px; padding: 16px; }
.ranking-row { display: grid; grid-template-columns: 38px 1fr auto; align-items: center; gap: 11px; min-height: 58px; padding: 8px 12px; border-radius: 14px; background: #f7f9fc; }
.ranking-row.player { background: #eaf4ff; }
.ranking-rank { display: grid; width: 31px; height: 31px; place-items: center; border-radius: 50%; background: white; color: #7a889b; font-size: 12px; font-weight: 900; }
.ranking-row strong { display: block; font-size: 13px; }
.ranking-row small { color: #7a889b; font-size: 10px; }
.ranking-xp { color: #ad7600; font-size: 12px; font-weight: 900; }
.game-icon { display: block; width: 21px; height: 21px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.shop-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin: 4px 0 21px; }
.shop-heading-main { display: flex; min-width: 0; align-items: flex-start; gap: 12px; }
.shop-heading-icon, .gem-balance { display: inline-flex; flex: 0 0 auto; align-items: center; justify-content: center; border-radius: 14px; background: #e9f2ff; color: var(--blue); }
.shop-heading-icon { width: 42px; height: 42px; }
.shop-heading h1 { margin: 0; color: var(--ink); font-size: 24px; letter-spacing: -.045em; line-height: 1.1; }
.shop-heading p { max-width: 470px; margin: 5px 0 0; color: #73839c; font-size: 11px; line-height: 1.5; }
.gem-balance { min-height: 38px; gap: 6px; padding: 7px 12px; background: #e4f8fb; color: #0985a6; font-size: 12px; }
.gem-balance .game-icon { width: 16px; height: 16px; fill: currentColor; stroke: none; }
.gem-balance strong { color: #047d9d; font-size: 14px; }
.gem-balance span { font-size: 9px; }
.shop-layout { display: grid; grid-template-columns: minmax(190px,205px) minmax(0,1fr); align-items: stretch; gap: 13px; }
.shop-preview-shell { padding: 3px; border: 1px solid rgba(64,116,196,.1); border-radius: 20px; background: #edf4ff; }
.shop-preview-card { display: flex; min-height: 100%; flex-direction: column; align-items: center; justify-content: flex-start; padding: 13px 12px 14px; border: 1px solid rgba(255,255,255,.8); border-radius: 16px; background: #fff; text-align: center; }
.shop-preview-art { display: grid; width: 100%; min-height: 132px; place-items: center; border-radius: 14px; background: #eef4ff; }
.shop-ruri-orbit { display: grid; width: 118px; aspect-ratio: 1; place-items: center; border-radius: 50%; background: rgba(255,255,255,.88); }
.shop-ruri-orbit .ruri-portrait { width: 118px; }
.shop-preview-card h2 { margin: 9px 0 3px; font-size: 12px; line-height: 1.35; }
.shop-preview-card p { max-width: 180px; margin: 0; color: #8290a6; font-size: 9px; line-height: 1.45; }
.shop-grid { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); grid-auto-rows: minmax(148px,auto); align-content: start; gap: 8px; }
.shop-item-shell { min-width: 0; padding: 2px; border: 1px solid rgba(64,116,196,.14); border-radius: 17px; background: #f1f6ff; transition: transform .36s var(--ease), border-color .36s var(--ease), background .36s var(--ease); }
.shop-item-shell:hover { transform: translateY(-2px); }

.shop-item { display: flex; min-width: 0; height: 100%; flex-direction: column; align-items: center; gap: 5px; padding: 9px 8px 7px; border-radius: 13px; background: #fff; text-align: center; }

.shop-art { display: grid; width: 38px; height: 38px; flex: 0 0 auto; place-items: center; border-radius: 12px; background: #eaf2ff; color: var(--blue); }

.shop-action { display: inline-flex; width: 100%; min-height: 33px; align-items: center; justify-content: center; gap: 6px; margin-top: auto; padding: 6px 8px; border: 0; border-radius: 10px; cursor: pointer; font-size: 9px; font-weight: 800; transition: transform .25s var(--ease), background .25s var(--ease), box-shadow .25s var(--ease); }
.shop-action:active:not(:disabled) { transform: scale(.98); }
.shop-action.is-buy { border-bottom: 3px solid #d38b05; background: #ffb81e; color: #674700; }

.shop-footnote { margin: 12px 0 0; color: #8391a7; font-size: 9px; }
.profile-grid { display: grid; grid-template-columns: minmax(0,1.15fr) minmax(250px,.85fr); gap: 14px; }
.profile-card { padding: 21px; }
.profile-identity { display: flex; align-items: center; gap: 14px; }
.profile-avatar { width: 80px; height: 80px; padding: 4px; border-radius: 50%; background: #eaf5ff; }
.profile-avatar .ruri-portrait { display: block; width: 100%; }
.profile-identity h2 { margin: 0; font-size: 21px; }
.profile-identity p { margin: 3px 0 0; color: #7b889c; font-size: 12px; }
.profile-stats { display: grid; grid-template-columns: repeat(2,1fr); gap: 9px; margin-top: 20px; }
.profile-stat { padding: 12px; border-radius: 14px; background: #f4f8fd; }
.profile-stat strong { display: block; font-size: 19px; }
.profile-stat span { color: #75839a; font-size: 11px; }
.profile-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.achievement-list { display: grid; gap: 9px; margin-top: 13px; }
.achievement { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; background: #f5f8fb; }
.achievement.is-locked { opacity: .46; }
.achievement-icon { display: grid; width: 34px; height: 34px; flex: 0 0 auto; place-items: center; border-radius: 11px; background: #fff5d9; }
.achievement strong { display: block; font-size: 12px; }
.achievement small { color: #7c899b; font-size: 10px; }
.settings-list { display: grid; gap: 0; }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 13px 0; border-bottom: 1px solid rgba(35,87,156,.09); }
.setting-row:last-child { border-bottom: 0; }
.setting-copy strong { display: block; font-size: 13px; }
.setting-copy small { color: #7a889b; font-size: 11px; }
.toggle { position: relative; width: 48px; height: 28px; flex: 0 0 auto; padding: 0; border: 0; border-radius: 99px; background: #d6e0eb; cursor: pointer; }
.toggle::after { position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background: white; box-shadow: 0 1px 3px rgba(34,58,89,.18); content: ""; transition: transform .3s var(--ease); }
.toggle[aria-checked="true"] { background: var(--blue); }
.toggle[aria-checked="true"]::after { transform: translateX(20px); }
.quest-page { max-width: 920px; }
.quest-page-head { display: flex; align-items: flex-start; gap: 12px; margin: 4px 0 16px; }
.quest-page-mark { display: grid; width: 42px; height: 42px; flex: 0 0 auto; place-items: center; border-radius: 14px; background: #e9f2ff; color: var(--blue); }
.quest-page-head h1 { margin: 0; color: var(--ink); font-size: 23px; letter-spacing: -.045em; line-height: 1.1; }
.quest-page-head p { margin: 5px 0 0; color: #73839c; font-size: 11px; line-height: 1.5; }
.streak-card { display: grid; grid-template-columns: 52px minmax(0,1fr) auto; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid #ffd09f; border-radius: 18px; background: #fff7ec; }
.streak-flame { display: grid; width: 52px; height: 52px; place-items: center; border-radius: 15px; background: #fff; color: #f2781d; }
.streak-flame .game-icon { width: 26px; height: 26px; fill: currentColor; stroke: currentColor; }
.streak-copy { min-width: 0; }
.streak-eyebrow { display: block; color: #bf6418; font-size: 8px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
.streak-copy strong { display: block; margin-top: 1px; color: #dc711c; font-size: 20px; line-height: 1.15; }
.streak-copy p { margin: 3px 0 0; color: #9b704e; font-size: 9px; line-height: 1.35; }
.streak-days { display: flex; align-items: center; gap: 5px; padding-left: 12px; }
.streak-days i { display: block; width: 9px; height: 9px; border-radius: 3px; background: #f2ddc4; }
.streak-days i.is-lit { background: #ef8a3e; box-shadow: 0 0 0 2px rgba(239,138,62,.13); }
.quest-group { margin-top: 16px; }
.quest-group-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 7px; }
.quest-group-head h2 { margin: 0; color: #172643; font-size: 14px; letter-spacing: -.02em; }
.quest-group-head span { color: #8090a8; font-size: 9px; }
.quest-full-list { display: grid; gap: 7px; }
.quest-full { min-width: 0; padding: 2px; border: 1px solid rgba(64,116,196,.14); border-radius: 17px; background: #eff5ff; }
.quest-full-core { display: grid; grid-template-columns: 38px minmax(0,1fr); align-items: center; gap: 11px; min-height: 69px; padding: 9px 11px; border-radius: 14px; background: #fff; }
.quest-icon-wrap { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 13px; background: #eaf2ff; color: var(--blue); }
.quest-icon-wrap .game-icon { width: 20px; height: 20px; }
.quest-full-copy { min-width: 0; }
.quest-full-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.quest-full-title strong { color: #172643; font-size: 11px; }
.quest-full-copy p { margin: 2px 0 6px; color: #8491a7; font-size: 9px; line-height: 1.35; }
.quest-full .quest-track { height: 6px; margin: 0; }
.quest-full-meta { display: flex; align-items: center; justify-content: space-between; gap: 9px; margin-top: 4px; color: #7e8ba1; font-size: 8px; font-weight: 800; }
.quest-full .quest-reward { color: #bd780e; font-size: 8px; }
.quest-complete { flex: 0 0 auto; padding: 3px 7px; border-radius: 99px; background: #e5f6ec; color: #397c57; font-size: 8px; font-weight: 800; }
.quest-full.is-done .quest-track span { background: #58ae80; }
.quest-group-weekly .quest-icon-wrap { background: #f1eaff; color: #7957ce; }
.quest-footnote { margin: 7px 0 0; color: #8391a7; font-size: 9px; line-height: 1.45; }

/* Illustrated quest board */
.quest-page { max-width: 1120px; }
.quest-page-grid { display: grid; grid-template-columns: minmax(0,1fr) 278px; align-items: start; gap: 16px; }
.quest-main-column { min-width: 0; }
.quest-feature { position: relative; display: grid; min-height: 190px; grid-template-columns: minmax(0,1fr) 170px; align-items: center; overflow: hidden; padding: 19px 21px; border-radius: 22px; background: radial-gradient(circle at 84% 17%,rgba(255,255,255,.25),transparent 20%),linear-gradient(120deg,#d943a2 0%,#e85d93 54%,#f38483 100%); color: #fff; box-shadow: 0 13px 28px rgba(196,63,143,.17); }
.quest-feature::before { position: absolute; top: -100px; right: 74px; width: 245px; height: 245px; border: 1px solid rgba(255,255,255,.14); border-radius: 50%; box-shadow: 0 0 0 18px rgba(255,255,255,.045),0 0 0 38px rgba(255,255,255,.035); content: ""; }
.quest-feature-copy { position: relative; z-index: 1; min-width: 0; }
.quest-feature-label, .league-eyebrow { display: block; color: rgba(255,255,255,.76); font-size: 8px; font-weight: 900; letter-spacing: .14em; }
.quest-feature h2 { max-width: 340px; margin: 5px 0 3px; color: #fff; font-size: clamp(19px,2vw,24px); letter-spacing: -.045em; line-height: 1.13; }
.quest-feature-copy > p { max-width: 370px; margin: 0 0 12px; color: rgba(255,255,255,.88); font-size: 10px; line-height: 1.45; }
.quest-feature-progress { max-width: 390px; padding: 10px 12px 11px; border: 1px solid rgba(255,255,255,.08); border-radius: 13px; background: #192837; box-shadow: 0 7px 18px rgba(34,20,46,.17); }
.quest-feature-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
.quest-feature-meta strong { font-size: 10px; }
.quest-feature-meta > span { display: inline-flex; align-items: center; gap: 4px; color: #ffd45d; font-size: 10px; font-weight: 900; }
.quest-feature-meta .game-icon { width: 14px; height: 14px; fill: currentColor; stroke: none; }
.quest-feature-progress .quest-track { height: 9px; margin: 0; background: #3b4c5a; }
.quest-feature-progress .quest-track span { background: linear-gradient(90deg,#ffd33f,#ff9d25); }
.quest-feature-art { position: relative; z-index: 1; display: grid; min-height: 150px; place-items: center; }
.quest-feature-orbit { position: absolute; width: 128px; aspect-ratio: 1; border: 1px solid rgba(255,255,255,.32); border-radius: 50%; background: rgba(255,255,255,.13); box-shadow: inset 0 0 0 10px rgba(255,255,255,.055),0 10px 22px rgba(99,28,84,.11); }
.quest-feature-ruri { position: relative; z-index: 1; width: 134px; filter: drop-shadow(0 9px 7px rgba(63,35,59,.2)); animation: float-ruri 4.2s var(--ease) infinite; }
.quest-feature-ruri .ruri-portrait { width: 100%; }
.quest-feature-spark, .quest-feature-flower, .quest-feature-sticker { position: absolute; z-index: 2; }
.quest-feature-spark { color: #fff5aa; font-size: 20px; text-shadow: 0 2px 8px rgba(255,245,170,.6); animation: reward-hop 3.2s var(--ease) infinite; }
.quest-feature-spark.spark-one { top: 9px; right: 28px; }
.quest-feature-spark.spark-two { top: 39px; left: 9px; color: #fff; font-size: 15px; animation-delay: .5s; }
.quest-feature-flower { right: 5px; bottom: 15px; color: #ffe68c; font-size: 26px; transform: rotate(-14deg); }
.quest-feature-sticker { right: 1px; bottom: 16px; padding: 5px 8px; border: 2px solid #fff; border-radius: 999px; background: #ffd14a; box-shadow: 0 4px 0 #d99221; color: #704414; font-size: 8px; font-weight: 1000; transform: rotate(7deg); }
.quest-side-column { display: grid; gap: 12px; }
.quest-badge-panel { overflow: hidden; border: 1px solid rgba(35,87,156,.13); border-radius: 20px; background: white; box-shadow: 0 9px 25px rgba(37,75,125,.045); }
.quest-badge-heading { display: flex; align-items: center; gap: 10px; padding: 14px 14px 11px; }
.quest-badge-heading-icon { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 13px; background: #fff2ce; font-size: 21px; box-shadow: inset 0 -2px rgba(222,164,38,.1); }
.quest-badge-heading h2 { margin: 0; color: #20304b; font-size: 13px; letter-spacing: -.025em; }
.quest-badge-heading p { margin: 2px 0 0; color: #8a98ad; font-size: 9px; }
.quest-badge-list { display: grid; padding: 0 10px; }
.quest-badge-row { display: grid; grid-template-columns: 42px minmax(0,1fr) 23px; align-items: center; gap: 8px; min-height: 62px; padding: 7px 5px; border-top: 1px solid #f0f3f8; }
.quest-badge-art { display: grid; width: 38px; height: 38px; place-items: center; border: 2px solid rgba(255,255,255,.85); border-radius: 14px 14px 16px 16px; box-shadow: 0 3px 8px rgba(29,50,82,.12),inset 0 -3px rgba(26,50,90,.11); font-size: 20px; transform: rotate(-4deg); }
.badge-tone-1 { background: linear-gradient(145deg,#8fdfff,#328af0); }
.badge-tone-2 { background: linear-gradient(145deg,#c7a6ff,#7854d3); }
.badge-tone-3 { background: linear-gradient(145deg,#ffe88b,#f3a834); }
.badge-tone-4 { background: linear-gradient(145deg,#ffc1d6,#ef719d); }
.quest-badge-row.is-locked .quest-badge-art { filter: grayscale(.72); opacity: .48; }
.quest-badge-copy { min-width: 0; }
.quest-badge-copy strong { display: block; overflow: hidden; color: #263550; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
.quest-badge-copy small { display: block; margin-top: 2px; color: #8794a8; font-size: 8px; line-height: 1.3; }
.quest-badge-state { display: grid; width: 21px; height: 21px; place-items: center; border-radius: 50%; background: #f2f5f9; color: #9aa8ba; font-size: 10px; font-weight: 900; }
.quest-badge-row.is-earned .quest-badge-state { background: #dcf6e9; color: #1c9b69; }
.quest-badge-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; padding: 10px 14px; background: #f7f9fe; color: #73839b; font-size: 8px; font-weight: 800; }
.quest-badge-footer span { color: #f2b935; font-size: 14px; }
.quest-side-note { display: flex; align-items: center; gap: 9px; padding: 11px; border: 1px solid #e5edf8; border-radius: 17px; background: #f2f7ff; }
.quest-note-art { width: 55px; flex: 0 0 auto; }
.quest-note-art .ruri-portrait { display: block; width: 100%; }
.quest-side-note p { margin: 0; color: #74839b; font-size: 9px; line-height: 1.5; }
.quest-side-note strong { display: block; margin-bottom: 2px; color: #263550; font-size: 10px; }
.quest-icon-wrap.quest-icon-daily, .quest-icon-wrap.quest-icon-weekly { border-radius: 14px; background: linear-gradient(145deg,#fff1a9,#ffd650); box-shadow: inset 0 -3px rgba(219,160,26,.16); font-size: 21px; }
.quest-full:nth-child(2) .quest-icon-wrap.quest-icon-daily { background: linear-gradient(145deg,#b9f0ff,#64c6f2); }
.quest-full:nth-child(3) .quest-icon-wrap.quest-icon-daily { background: linear-gradient(145deg,#d5ff94,#76d342); }
.quest-group-weekly .quest-icon-wrap.quest-icon-weekly { background: linear-gradient(145deg,#d2e6ff,#83b5ff); }
.quest-group-weekly .quest-full:nth-child(2) .quest-icon-wrap.quest-icon-weekly { background: linear-gradient(145deg,#ffdb9c,#ffa344); }

/* Local league with illustrated medals and a Ruri player card */
.league-page { max-width: 1120px; }
.league-layout { display: grid; grid-template-columns: minmax(0,1fr) 260px; align-items: start; gap: 15px; }
.league-main { display: grid; min-width: 0; gap: 12px; }
.league-banner { position: relative; min-height: 186px; overflow: hidden; padding: 17px 21px 18px; border-radius: 22px; background: radial-gradient(circle at 92% 19%,rgba(154,231,210,.19),transparent 24%),linear-gradient(118deg,#183e75 0%,#265994 54%,#467cb2 100%); color: #fff; box-shadow: 0 14px 30px rgba(30,64,116,.16); }
.league-banner::after { position: absolute; right: 90px; bottom: -102px; width: 220px; height: 220px; border: 1px solid rgba(255,255,255,.13); border-radius: 50%; box-shadow: 0 0 0 17px rgba(255,255,255,.04),0 0 0 36px rgba(255,255,255,.035); content: ""; }
.league-tier-strip { position: relative; z-index: 1; display: flex; align-items: end; gap: 7px; height: 55px; margin-bottom: 9px; }
.tier-stamp { position: relative; display: block; width: 31px; flex: 0 0 auto; opacity: .55; filter: saturate(.83); transition: transform .35s var(--ease),opacity .35s var(--ease); }
.tier-stamp svg { display: block; width: 100%; overflow: visible; filter: drop-shadow(0 3px 2px rgba(0,0,0,.18)); }
.tier-stamp svg path:first-child { fill: #6b7f90; stroke: rgba(255,255,255,.3); stroke-width: 1.5; }
.tier-stamp svg path:nth-child(2) { fill: #435b70; }
.tier-stamp svg circle { fill: #b5c4cf; }
.tier-stamp.amber svg path:first-child { fill: #e4a932; }
.tier-stamp.amber svg path:nth-child(2) { fill: #f7ca58; }
.tier-stamp.amber svg circle { fill: #fff2b5; }
.tier-stamp.sapphire svg path:first-child { fill: #309dd2; }
.tier-stamp.sapphire svg path:nth-child(2) { fill: #58c4f1; }
.tier-stamp.sapphire svg circle { fill: #d6f6ff; }
.tier-stamp.ruby svg path:first-child { fill: #df5361; }
.tier-stamp.ruby svg path:nth-child(2) { fill: #fa7881; }
.tier-stamp.ruby svg circle { fill: #ffd8d9; }
.tier-stamp.emerald svg path:first-child { fill: #43a65c; }
.tier-stamp.emerald svg path:nth-child(2) { fill: #89d339; }
.tier-stamp.emerald svg circle { fill: #e4ff97; }
.tier-stamp.onyx svg path:first-child { fill: #596b7e; }
.tier-stamp.onyx svg path:nth-child(2) { fill: #8496a6; }
.tier-stamp.sakura svg path:first-child { fill: #d675ac; }
.tier-stamp.sakura svg path:nth-child(2) { fill: #f2a2ca; }
.tier-stamp.star svg path:first-child { fill: #7559c8; }
.tier-stamp.star svg path:nth-child(2) { fill: #a68bf3; }
.tier-stamp.is-unlocked { opacity: .92; filter: saturate(1); }
.tier-stamp.is-locked { opacity: .2; filter: grayscale(1); }
.tier-stamp.is-active { width: 46px; opacity: 1; filter: saturate(1); transform: translateY(-2px); }
.tier-stamp.is-active svg { filter: drop-shadow(0 5px 5px rgba(7,27,57,.3)); }
.tier-stamp b { position: absolute; top: 47%; left: 50%; color: #fff; font-size: 8px; line-height: 1; text-shadow: 0 1px 3px rgba(21,40,66,.5); transform: translate(-50%,-50%); }
.tier-stamp.is-locked b { color: #d3dfeb; }
.league-banner-copy { position: relative; z-index: 1; max-width: 480px; }
.league-banner .league-eyebrow { color: #aad5ee; }
.league-banner h2 { margin: 3px 0 3px; color: white; font-size: 22px; letter-spacing: -.04em; }
.league-banner-copy p { margin: 0; color: rgba(233,244,255,.8); font-size: 10px; }
.league-banner-art { position: absolute; z-index: 1; top: 30px; right: 18px; display: grid; width: 145px; height: 128px; place-items: center; color: #ffd34e; }
.league-banner-art::before { position: absolute; width: 100px; aspect-ratio: 1; border: 1px solid rgba(230,255,243,.25); border-radius: 50%; background: rgba(168,229,216,.14); box-shadow: inset 0 0 0 10px rgba(255,255,255,.045); content: ""; }
.league-banner-art > span { position: absolute; top: 7px; right: 13px; color: #e5ffb0; font-size: 24px; }
.league-banner-art svg { position: relative; width: 112px; overflow: visible; filter: drop-shadow(0 7px 4px rgba(8,26,49,.29)); animation: float-ruri 4.8s var(--ease) infinite; }
.league-banner-art svg .league-emblem-shell { fill: #ffbd31; stroke: #ffeb96; stroke-width: 2; }
.league-banner-art svg .league-emblem-inner { fill: #db8e28; stroke: rgba(255,255,255,.52); stroke-width: 1.3; }
.league-banner-art svg .league-emblem-star { fill: #ffe878; stroke: #cf8b20; stroke-width: 2; stroke-linejoin: round; }
.league-banner-art > b { position: absolute; z-index: 2; top: 53px; color: #fff; font-size: 18px; line-height: 1; text-shadow: 0 2px 3px rgba(35,51,77,.5); }
.league-banner-art.tier-unranked { filter: grayscale(.8); opacity: .8; }
.league-banner-art.tier-unranked svg .league-emblem-shell { fill: #72869a; stroke: #b3c2d1; }
.league-banner-art.tier-unranked svg .league-emblem-inner { fill: #4a6178; }
.league-banner-art.tier-unranked svg .league-emblem-star { fill: #9cafc1; stroke: #5e7387; }
.league-banner-art.tier-sapphire svg .league-emblem-shell { fill: #309dd2; stroke: #a7e8ff; }
.league-banner-art.tier-sapphire svg .league-emblem-inner { fill: #1674ae; }
.league-banner-art.tier-sapphire svg .league-emblem-star { fill: #b6f2ff; stroke: #1674ae; }
.league-banner-art.tier-ruby svg .league-emblem-shell { fill: #df5361; stroke: #ffc4c8; }
.league-banner-art.tier-ruby svg .league-emblem-inner { fill: #b83652; }
.league-banner-art.tier-ruby svg .league-emblem-star { fill: #ffe1dd; stroke: #b83652; }
.league-banner-art.tier-emerald svg .league-emblem-shell { fill: #43a65c; stroke: #c9ff8f; }
.league-banner-art.tier-emerald svg .league-emblem-inner { fill: #347f4f; }
.league-banner-art.tier-emerald svg .league-emblem-star { fill: #e8ff9e; stroke: #347f4f; }
.league-banner-art.tier-onyx svg .league-emblem-shell { fill: #596b7e; stroke: #c0d1df; }
.league-banner-art.tier-onyx svg .league-emblem-inner { fill: #3d5064; }
.league-banner-art.tier-onyx svg .league-emblem-star { fill: #dce8f1; stroke: #3d5064; }
.league-banner-art.tier-sakura svg .league-emblem-shell { fill: #d675ac; stroke: #ffd1e7; }
.league-banner-art.tier-sakura svg .league-emblem-inner { fill: #ad5186; }
.league-banner-art.tier-sakura svg .league-emblem-star { fill: #ffe7f0; stroke: #ad5186; }
.league-banner-art.tier-star svg .league-emblem-shell { fill: #7559c8; stroke: #d6c8ff; }
.league-banner-art.tier-star svg .league-emblem-inner { fill: #57419f; }
.league-banner-art.tier-star svg .league-emblem-star { fill: #f2e6ff; stroke: #57419f; }
.league-banner-art.tier-amber svg .league-emblem-shell { fill: #e4a932; stroke: #fff0aa; }
.league-banner-art.tier-amber svg .league-emblem-inner { fill: #bf7d19; }
.league-banner-art.tier-amber svg .league-emblem-star { fill: #fff0a3; stroke: #bf7d19; }
.league-rank-progress { position: relative; z-index: 1; width: calc(100% - 155px); max-width: 440px; margin-top: 9px; }
.league-rank-progress-copy { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; color: rgba(235,245,255,.86); font-size: 8px; font-weight: 800; }
.league-rank-progress-copy strong { color: #d4ffad; font-size: 8px; white-space: nowrap; }
.league-rank-track { height: 6px; overflow: hidden; border-radius: 99px; background: rgba(9,31,58,.42); }
.league-rank-track span { display: block; width: var(--rank-progress,0%); height: 100%; border-radius: inherit; background: linear-gradient(90deg,#a1e37d,#e1fa91); transition: width .5s var(--ease); }
.league-board { padding: 15px; }
.league-board-heading { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.league-board-heading .league-eyebrow { color: #8796ac; font-size: 7px; }
.league-board-heading h2 { margin: 2px 0 0; color: #21314d; font-size: 14px; letter-spacing: -.025em; }
.league-board-tag { padding: 5px 8px; border-radius: 999px; background: #f0f5fb; color: #8392a8; font-size: 8px; font-weight: 800; }
.podium-stage { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); align-items: end; gap: 9px; min-height: 190px; padding: 17px 9px 0; }
.podium-person { position: relative; display: flex; min-width: 0; flex-direction: column; align-items: center; justify-content: end; gap: 3px; padding: 9px 5px 0; border-radius: 16px 16px 0 0; text-align: center; }
.podium-person.rank-1 { min-height: 182px; background: linear-gradient(180deg,#fff8dc,#fffdf7); }

.podium-person.rank-3 { background: linear-gradient(180deg,#fff2e9,#fffaf6); }
.podium-person > strong { display: block; max-width: 100%; overflow: hidden; color: #263650; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
.podium-person > small { color: #8291a7; font-size: 8px; font-weight: 800; }
.podium-medal { position: relative; z-index: 1; display: block; width: 34px; height: 39px; flex: 0 0 auto; }

.podium-medal.silver svg path:first-child { fill: #aab8c8; }
.podium-medal.silver svg .medal-inner { fill: #e9f0f6; }
.podium-medal.bronze svg path:first-child { fill: #ce8659; }
.podium-medal.bronze svg .medal-inner { fill: #f4c49e; }
.podium-medal.stone svg path:first-child { fill: #92a2b5; }
.podium-medal.stone svg .medal-inner { fill: #dce5ee; }
.podium-medal b { position: absolute; inset: 10px 0 auto; color: #fff; font-size: 11px; line-height: 1; text-align: center; text-shadow: 0 1px 2px rgba(70,50,13,.4); }
.league-avatar { display: grid; width: 55px; height: 55px; flex: 0 0 auto; place-items: center; overflow: hidden; border: 3px solid white; border-radius: 50%; background: #e7f3ff; box-shadow: 0 4px 11px rgba(31,54,87,.16); font-size: 26px; }

.podium-step { position: absolute; right: 0; bottom: 0; left: 0; display: grid; height: 19px; place-items: center; border-radius: 8px 8px 0 0; background: #ffe58e; color: #b87e12; font-size: 9px; font-weight: 1000; }
.rank-2 .podium-step { height: 17px; background: #d8e4ef; color: #708195; }
.rank-3 .podium-step { height: 16px; background: #f3d2b9; color: #aa6b3e; }
.ranking-list { padding: 9px; }

.toast-region { position: fixed; z-index: 15; right: 20px; bottom: 20px; display: grid; gap: 8px; pointer-events: none; }
.toast { max-width: min(360px,calc(100vw - 40px)); padding: 12px 16px; border-radius: 14px; background: var(--ink); box-shadow: 0 10px 32px rgba(26,47,74,.2); color: white; font-size: 13px; animation: toast-in .34s var(--ease) both; }

/* Chapter palettes */
.theme-hiragana { --chapter: #2f7df0; --chapter-deep: #1d5fd0; --chapter-ground: #edf5ff; --chapter-accent: #ddf1cc; }
.theme-katakana { --chapter: #3979d5; --chapter-deep: #28559d; --chapter-ground: #edf6ff; --chapter-accent: #d0e9fa; }
.theme-kanji { --chapter: #d65b40; --chapter-deep: #ad402d; --chapter-ground: #fff3df; --chapter-accent: #ead6a7; }

@keyframes current-breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.055); } }
@keyframes float-ruri { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes cloud-drift { 0%,100% { margin-left: 0; } 50% { margin-left: 24px; } }
@keyframes sun-breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
@keyframes twinkle { 0%,100% { opacity: .48; transform: scale(.9) rotate(-8deg); } 50% { opacity: .95; transform: scale(1.12) rotate(8deg); } }
@keyframes chest-glow { 0%,100% { box-shadow: 0 3px 0 #be771c,0 5px 10px rgba(54,64,81,.16); } 50% { box-shadow: 0 3px 0 #be771c,0 0 0 5px rgba(255,205,82,.22),0 5px 14px rgba(222,162,45,.28); } }
@keyframes veil-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes dialog-in { from { opacity: 0; transform: translateY(13px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes reward-hop { 0% { opacity: 0; transform: translateY(12px) scale(.92); } 70% { transform: translateY(-5px) scale(1.04); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  function choiceList(chapterId,key,answer,material,seed) {
    const pool = itemPool[chapterId].map(item => item[key]).filter(value => value && String(value).trim());

    const options = [...new Set([String(answer),...distractors])].sort((a,b) => ((seed+a.length*3)%13)-((seed+b.length*3)%13));
    return options.slice(0,4);

  function validateCurriculum() {
    const errors = [];

    let totalCourses = 0;
    for (const [chapterId,[levelCount,courseCount]] of Object.entries(expected)) {

      const chapterCourses = courses.filter(course=>course.chapter===chapterId);
      if (levels.length !== levelCount) errors.push(`${chapterId}: ${levels.length} level, seharusnya ${levelCount}.`);
      if (chapterCourses.length !== courseCount) errors.push(`${chapterId}: ${chapterCourses.length} kursus, seharusnya ${courseCount}.`);
      totalLevels += levels.length; totalCourses += chapterCourses.length;
      levels.forEach((level,index)=>{
        if (level.courses.length !== 15) errors.push(`${level.id}: jumlah kursus bukan 15.`);
        level.courses.forEach((course,courseIndex)=>{

  class GameState {

    }

    }
    ensureWeek() {
      const start=weekStartKey();
      if (this.state.weekly?.weekStart !== start) this.state.weekly = {weekStart:start,practiceIds:[],legendaryIds:[],claimed:{}};
    }
    setProfile(name,goal) {
      this.state.profile.name = String(name||"").trim().slice(0,24) || "Rina";
      this.state.profile.dailyGoal = [5,15,30].includes(goal) ? goal : 15;
      this.state.profile.onboarded = true;

    }
    setSelection(chapter,level,course=1) {
      if (DATA.chapters[chapter]) this.state.selection.chapter = chapter;

      const selectedLevel=Math.max(1,Math.min(DATA.chapters[selectedChapter].levels,Number(level)||1));
      if (!this.state.selection.levelsByChapter) this.state.selection.levelsByChapter={hiragana:1,katakana:1,kanji:1};
      this.state.selection.levelsByChapter[selectedChapter]=selectedLevel;
      this.state.selection.level=selectedLevel;
      this.state.selection.course = Math.max(1,Math.min(15,Number(course)||1));
      this.save();
    }
    courseProgress(id) { return this.state.progress[id] || {practiceComplete:false,legendaryUnlocked:false,legendaryComplete:false,bestPractice:0,bestLegendary:0}; }
    isPracticeUnlocked(courseOrId) {
      const course = typeof courseOrId === "string" ? COURSE_BY_ID.get(courseOrId) : courseOrId;
      return !!course && (!course.prerequisite || this.courseProgress(course.prerequisite).practiceComplete);
    }
    isChapterUnlocked(chapterId) {
      const chapterOrder = ["hiragana","katakana","kanji"];
      const index = chapterOrder.indexOf(chapterId);
      if (index <= 0) return index === 0;
      const previousChapter = chapterOrder[index-1];
      const lastId = `${previousChapter}-l${String(DATA.chapters[previousChapter].levels).padStart(2,"0")}-c15`;
      return this.courseProgress(lastId).practiceComplete;
    }
    currentCourse() { return DATA.courses.find(course=>!this.courseProgress(course.id).practiceComplete) || DATA.courses[DATA.courses.length-1]; }
    completionCount(chapterId=null) {
      const ids = this.state.stats.practiceIds;

      return DAILY_QUESTS.map(quest=>({
        ...quest,progress:Math.min(values[quest.id],quest.target),done:values[quest.id]>=quest.target,claimed:this.state.quests.claimed[quest.id]===true,
        display:quest.id==="time"?`${Math.floor(Math.min(values.time,quest.target)/60)} / 3 min`:`${Math.min(values[quest.id],quest.target)} / ${quest.target}`

    }
    claimReadyQuests(rewards) {
      for (const quest of this.getQuests()) {
        if (quest.done && !quest.claimed) {

          rewards.push({kind:"quest",quest:quest.title,xp:quest.reward.xp||0,gems:quest.reward.gems||0});
        }
      }
    }
    claimReadyWeeklyQuests(rewards) {

    }
    evaluateAchievements(rewards) {
      const count = this.state.stats.practiceIds.length;
      const firstChapter = this.state.progress["hiragana-l30-c15"]?.practiceComplete;
      const secondChapter = this.state.progress["katakana-l40-c15"]?.practiceComplete;
      const lastChapter = this.state.progress["kanji-l50-c15"]?.practiceComplete;
      const conditions = {

        "hiragana-finish": firstChapter,

      for (const achievement of ACHIEVEMENTS) {

      const safeScore = Math.max(0,Math.min(100,Math.round(Number(score)||0)));

          this.state.quests.practiceIds = [...new Set([...this.state.quests.practiceIds,id])];

      } else if (mode === "legendary") {
        if (!progress.legendaryUnlocked || !progress.practiceComplete) throw new Error("Legendary baru terbuka setelah Practice kursus ini selesai.");
        progress.bestLegendary = Math.max(progress.bestLegendary,safeScore);
        if (!progress.legendaryComplete) {
          firstCompletion = true;
          progress.legendaryComplete = true;
          progress.legendaryCompletedOn = todayKey();
          this.state.resources.xp += 40;
          this.state.stats.legendaryIds.push(id);
          this.state.stats.legendaryLessons = this.state.stats.legendaryIds.length;
          this.state.stats.correctAnswers += safeAnswers;
          this.state.stats.history.push({id,mode,date:todayKey(),score:safeScore});
          this.state.weekly.legendaryIds=[...new Set([...this.state.weekly.legendaryIds,id])];
          if (safeScore >= 80) this.state.quests.highScoreIds = [...new Set([...this.state.quests.highScoreIds,id])];

          this.claimReadyQuests(rewards);

      this.claimReadyWeeklyQuests(rewards);

    setSetting(key,value) {
      if (key === "romaji" || key === "sound") this.state.settings[key] = Boolean(value);
      if (key === "voice") this.state.settings.voice = String(value||"").slice(0,120);

    rename(name) {

    }
    purchase(itemId) {
      const item = COSMETICS.find(entry=>entry.id===itemId);
      if (!item) throw new Error("Aksesori tidak ditemukan.");
      if (this.state.inventory.includes(itemId)) throw new Error("Aksesori ini sudah dimiliki.");
      if (this.state.resources.gems < item.price) throw new Error("Permata belum cukup untuk aksesori ini.");
      this.state.resources.gems -= item.price;
      this.state.inventory.push(itemId);
      this.state.selectedCosmetic = itemId;
      this.save();
      return item;
    }
    selectCosmetic(itemId) {
      if (itemId && !this.state.inventory.includes(itemId)) throw new Error("Aksesori ini belum dimiliki.");
      this.state.selectedCosmetic = itemId || null;
      this.save();
    }
    exportJSON() { return JSON.stringify(this.state,null,2); }
    importJSON(text) {
      let incoming;
      try { incoming = normalizeSave(JSON.parse(text)); }
      catch (error) { throw new Error(error.message || "Berkas simpan tidak dapat dibaca."); }
      this.state = incoming;
      this.ensureToday();
      this.save();
    }
    reset() {
      this.state = emptySave();
      this.save();
    }
  }

  return { GameState, DAILY_QUESTS, WEEKLY_QUESTS, ACHIEVEMENTS, COSMETICS, COURSE_BY_ID, todayKey };
})();

  function showToast(message,type="") {
    const region = document.querySelector(".toast-region");
    if (!region) return;
    const node = document.createElement("div");
    node.className = `toast ${type}`;
    node.setAttribute("role","status");
    node.textContent = message;
    region.append(node);
    window.setTimeout(()=>node.remove(),3700);
  }
  function openDialog(nextDialog,focusSelector="[data-dialog-initial]") {
    dialogReturnFocus = document.activeElement;

    requestAnimationFrame(()=>document.querySelector(focusSelector)?.focus());
  }
  function closeDialog() {
    if (!dialog) return;
    dialog = null;
    renderApp();
    if (dialogReturnFocus?.isConnected) dialogReturnFocus.focus();
  }
  async function playTone(kind="correct") {
    if (!state().settings.sound) return;
    try {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return;
      if (!audioContext || audioContext.state === "closed") audioContext = new AudioCtor();
      const context=audioContext;
      if (context.state === "suspended") await context.resume();
      const notes=kind==="correct"?[523.25,659.25]:kind==="reward"?[659.25,783.99,1046.5]:[220,164.81];
      const now=context.currentTime;
      notes.forEach((frequency,index)=>{
        const start=now+index*.085;
        const oscillator=context.createOscillator();
        const gain=context.createGain();
        oscillator.type=kind==="wrong"?"triangle":"sine";
        oscillator.frequency.setValueAtTime(frequency,start);
        gain.gain.setValueAtTime(.0001,start);
        gain.gain.exponentialRampToValueAtTime(kind==="wrong"?.04:.055,start+.018);
        gain.gain.exponentialRampToValueAtTime(.0001,start+.15);
        oscillator.connect(gain); gain.connect(context.destination);
        oscillator.start(start); oscillator.stop(start+.16);
      });
    } catch (error) { console.info("Efek suara tidak tersedia di browser ini.",error); }
  }
  function speakJapanese(text) {
    if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
      showToast(`Audio tidak tersedia. Teks Jepang: ${text}`,"warning");
      return;
    }
    const synth=window.speechSynthesis;
    const voices = synth.getVoices();
    const japaneseVoices = voices.filter(voice=>voice.lang.toLowerCase().startsWith("ja"));
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "ja-JP";
    const preferred = japaneseVoices.find(voice=>voice.name===state().settings.voice) || japaneseVoices[0];
    if (preferred) utterance.voice = preferred;
    utterance.rate = .84;
    utterance.pitch = 1.04;
    utterance.onerror = event=>{if(event.error!=="canceled"&&event.error!=="interrupted")showToast("Suara Jepang tidak dapat diputar di browser ini.","warning");};
    synth.cancel();
    synth.resume();
    synth.speak(utterance);
  }
  function speakIfJapanese(text) {
    const value=String(text||"");
    if (/[\u3040-\u30ff\u3400-\u9fff]/u.test(value)) speakJapanese(value);

  function renderChapterTabs(chapterId) {
    return `<div class="chapter-switcher" role="group" aria-label="Pilih bab">${Object.values(DATA.chapters).map(chapter=>{
      const unlocked=game.isChapterUnlocked(chapter.id);
      const progress=game.chapterCompletion(chapter.id);
      return `<button type="button" class="chapter-tab ${chapter.theme} ${chapter.id===chapterId?"is-selected":""}" data-chapter="${chapter.id}" aria-pressed="${chapter.id===chapterId}" ${!unlocked?`aria-label="${esc(chapter.title)}, terkunci"`:""}>
        <span class="chapter-symbol" aria-hidden="true">${chapter.symbol}</span><span><strong>${esc(chapter.short)}</strong><small>${unlocked?`${progress.complete}/${chapter.courseCount} kursus`:`Terkunci`}</small></span></button>`;
    }).join("")}</div>`;
  }
  function courseNodeMarkup(course,currentId) {
    const progress=game.courseProgress(course.id);
    const unlocked=game.isPracticeUnlocked(course);
    const done=progress.practiceComplete;
    const isCurrent=course.id===currentId&&!done&&unlocked;
    const glyph=course.materials[0]?.glyph || "あ";
    const ordinal=DATA.courses.indexOf(course)+1;
    const hasChest=ordinal>0&&ordinal%5===0;
    const chestClaimed=hasChest&&state().chestsClaimed.includes(ordinal/5);
    const status=done?"Selesai":progress.legendaryUnlocked?"Legendary terbuka":unlocked?course.activityLabel:"Terkunci";
    return `<button type="button" class="course-tile ${done?"is-complete":""} ${!unlocked?"is-locked":""} ${isCurrent?"is-current":""}" data-course-id="${course.id}" aria-label="Kursus ${course.course}, ${esc(course.title)}${done?", selesai":unlocked?", tersedia":", terkunci"}" title="${esc(course.title)}">
      <span class="course-tile-number">${String(course.course).padStart(2,"0")}</span><span class="course-tile-glyph" lang="ja">${done?"✓":unlocked?esc(glyph):"🔒"}</span>
      <span class="course-tile-copy"><strong>Kursus ${String(course.course).padStart(2,"0")}</strong><small>${esc(status)}</small></span>
      ${progress.legendaryUnlocked?'<span class="course-tile-legendary" aria-label="Legendary terbuka">★</span>':""}
      ${hasChest?`<span class="course-tile-chest ${chestClaimed?"is-open":done?"is-earned":unlocked?"is-ready":"is-locked"}" aria-label="Peti bonus ${chestClaimed?"sudah diklaim":done?"diperoleh":"menunggu"}">${chestClaimed?"✨":"🎁"}</span>`:""}
    </button>`;
  }
  function levelLandmarkMarkup(chapterId,groupIndex,levelStart,levelEnd,currentLevel,selectedLevel) {
    const current=game.currentCourse();
    const levels=DATA.levelLookup[chapterId].slice(levelStart-1,levelEnd);
    const courses=levels.flatMap(entry=>entry.courses);
    const startCourse=courses[0];
    const complete=courses.filter(course=>game.courseProgress(course.id).practiceComplete).length;
    const percent=Math.round(complete/courses.length*100);
    const locked=!game.isPracticeUnlocked(startCourse);

  function renderShop() {
    const s=state();
    const selected=Store.COSMETICS.find(item=>item.id===s.selectedCosmetic)||Store.COSMETICS[0];
    const title=selected.kind==="theme"?`Ruri di ${selected.name}`:`Ruri dengan ${selected.name}`;
    const previewCopy=selected.kind==="theme"?"Tema ini mengubah suasana tampilan permainan.":"Aksesori yang dipakai muncul di seluruh permainan.";
    return `<div class="section-view shop-page"><header class="shop-heading"><div class="shop-heading-main"><span class="shop-heading-icon">${shopIcon("bag")}</span><div><h1>Toko Ruri</h1><p>Tukar permata hasil belajar dengan aksesori dan tema. Semua item kosmetik; materi belajar tetap gratis.</p></div></div><div class="gem-balance" aria-label="${formatNumber(s.resources.gems)} permata">${shopIcon("gem")}<strong>${formatNumber(s.resources.gems)}</strong><span>permata</span></div></header>
      <div class="shop-layout"><aside class="shop-preview-shell"><div class="shop-preview-card"><div class="shop-preview-art"><div class="shop-ruri-orbit">${ruriSvg("happy")}</div></div><h2>${esc(title)}</h2><p>${previewCopy}</p></div></aside>
        <div class="shop-grid">${Store.COSMETICS.map(item=>{
          const owned=s.inventory.includes(item.id);
          const equipped=s.selectedCosmetic===item.id;
          const affordable=s.resources.gems>=item.price;
          const cardClass=`shop-item-shell ${equipped?"is-equipped":""} ${!owned&&!affordable?"is-unaffordable":""}`;
          const action=equipped?`<button type="button" class="shop-action is-current" aria-pressed="true" disabled>Sedang dipakai</button>`:owned?`<button type="button" class="shop-action is-owned" data-equip="${item.id}" aria-pressed="false">Pakai</button>`:`<button type="button" class="shop-action is-buy" data-buy="${item.id}" ${!affordable?"disabled":""}><span>${shopIcon("gem")}</span>${item.price}</button>`;
          return `<article class="${cardClass}"><div class="shop-item"><span class="shop-art">${shopIcon(item.icon)}</span><strong>${esc(item.name)}</strong><p>${esc(item.description)}</p>${action}</div></article>`;
        }).join("")}</div>
      </div><p class="shop-footnote">Permata berasal dari aktivitas belajar dan peti kursus. Tidak ada iklan atau pembelian uang sungguhan.</p>
    </div>`;
  }

  function drawRoute() {
    const map=document.getElementById("map-scroll");
    const svg=document.getElementById("path-svg");
    const path=document.getElementById("path-shadow");
    const inner=document.getElementById("path-dashes");
    if (!map||!svg||!path||!inner) return;
    const width=map.clientWidth;
    const height=map.scrollHeight;
    svg.setAttribute("viewBox",`0 0 ${width} ${height}`);
    svg.setAttribute("width",String(width)); svg.setAttribute("height",String(height));
    const nodeSize=map.querySelector(".zone-node")?.getBoundingClientRect().height||68;
    const nodes=[...map.querySelectorAll(".map-landmark")].map(node=>({x:width*Number(node.dataset.mapX)/100,y:Number(node.dataset.mapY)+nodeSize/2}));
    if (!nodes.length) return;
    let d=`M ${nodes[0].x} ${nodes[0].y}`;
    for (let i=1;i<nodes.length;i++) {
      const a=nodes[i-1],b=nodes[i],mid=(a.y+b.y)/2;
      d+=` C ${a.x} ${mid}, ${b.x} ${mid}, ${b.x} ${b.y}`;
    }
    path.setAttribute("d",d); inner.setAttribute("d",d);
  }

  function shuffleBySeed(items,seed) {
    const result=[...items];
    let value=seed>>>0;
    for (let i=result.length-1;i>0;i--) {
      value=(value*1664525+1013904223)>>>0;
      const j=value%(i+1);
      [result[i],result[j]]=[result[j],result[i]];
    }
    return result;
  }
  function makeMemoryCards() {
    const items=lesson.course.materials;
    const cards=items.flatMap((item,index)=>[
      {id:`g${index}`,pair:index,label:item.glyph,kind:"glyph"},
      {id:`r${index}`,pair:index,label:item.kind==="kanji"?item.wordReading:item.reading,kind:"reading"}
    ]);
    return shuffleBySeed(cards,lesson.course.level*47+lesson.course.course*19);
  }
  function makeConstructTiles(item) {
    const wanted=Array.from(item.word||item.glyph);
    const other=lesson.course.materials.filter(entry=>entry!==item).flatMap(entry=>Array.from(entry.word||entry.glyph));
    const extras=other.filter((char,index)=>!wanted.includes(char)&&other.indexOf(char)===index).slice(0,2);
    const tiles=[...wanted.map((char,index)=>({id:`target-${index}`,char,target:true})),...extras.map((char,index)=>({id:`extra-${index}`,char,target:false}))];
    return shuffleBySeed(tiles,lesson.course.level*31+lesson.index*13+lesson.course.course);
  }
  function initializeQuestionState() {
    if (!lesson) return;
    const question=lesson.questions[lesson.index];
    if (!question) return;
    const q={selected:null,checked:false,wrong:false,textAnswer:"",drawn:false,usedTiles:[],wordBuild:[],pairMatches:{},pairLeft:null,pairRight:null,pairMessage:"",memoryOpen:[],memoryMatched:[],memoryCards:[],tiles:[],timeExpired:false};
    if (lesson.course.interaction==="memory") q.memoryCards=makeMemoryCards();
    if (lesson.course.interaction==="construct") q.tiles=makeConstructTiles(question.material);
    lesson.questionState=q;
  }
  function startLessonTimer() {
    stopLessonTimer();

      if (!lesson||document.hidden||lesson.result) return;

  function lessonCanCheck() {
    if (!lesson) return false;
    const q=lesson.questionState;
    if (q.checked||q.wrong||q.timeExpired) return false;
    const interaction=lesson.course.interaction;
    if (interaction==="trace") return q.drawn;
    if (interaction==="pairs"||interaction==="memory") return false;
    if (interaction==="text") return !!q.textAnswer.trim();
    if (interaction==="construct") return q.wordBuild.length>0;
    return q.selected!==null;

  function setupTraceCanvas() {
    const canvas=document.getElementById("trace-canvas");
    if (!canvas||lesson?.course.interaction!=="trace") return;
    const rect=canvas.getBoundingClientRect();
    if (!rect.width||!rect.height) return;
    const ratio=Math.min(2,window.devicePixelRatio||1);
    canvas.width=Math.round(rect.width*ratio); canvas.height=Math.round(rect.height*ratio);
    const ctx=canvas.getContext("2d");
    ctx.scale(ratio,ratio);
    const guide=document.querySelector(".trace-guide");
    if (guide) guide.style.display="none";
    const glyph=lesson.questions[lesson.index].material.glyph;
    ctx.font=`800 ${Math.min(rect.height*.72,154)}px "Yu Gothic UI", "Meiryo", sans-serif`;
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillStyle="rgba(23,96,212,.14)";
    ctx.fillText(glyph,rect.width/2,rect.height/2+5);
    ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#1760d4"; ctx.lineWidth=7;
    let drawing=false;
    const position=event=>{const bounds=canvas.getBoundingClientRect();return {x:event.clientX-bounds.left,y:event.clientY-bounds.top};};
    canvas.addEventListener("pointerdown",event=>{event.preventDefault();drawing=true;lesson.questionState.drawn=true;canvas.setPointerCapture(event.pointerId);const point=position(event);ctx.beginPath();ctx.moveTo(point.x,point.y);ctx.lineTo(point.x+.1,point.y+.1);ctx.stroke();syncCheckButton();});
    canvas.addEventListener("pointermove",event=>{if(!drawing)return;const point=position(event);ctx.lineTo(point.x,point.y);ctx.stroke();});
    const end=()=>{drawing=false;};
    canvas.addEventListener("pointerup",end); canvas.addEventListener("pointercancel",end);
  }
